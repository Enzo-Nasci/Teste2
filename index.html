<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Boletim</title>
</head>
<style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            padding-top: 60px;
        }

        .cartao {
            background-color: white;
            border-radius: 10px;
            padding: 30px 40px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            width: 340px;
        }

        h1 {
            color: #1f3a5f;
            margin-top: 0;
        }

        .situacao {
            background-color: #e7f3ec;
            color: #1e7a46;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
        }
</style>

<body>

    <div class="cartao">
        <h1>Boletim</h1>
        <p><strong>Aluno:</strong> <span id="nome"></span></p>
        <p><strong>Notas:</strong> <span id="notas"></span></p>
        <p><strong>Média:</strong> <span id="media"></span></p>
        <p class="situacao" id="situacao"></p>
    </div>
    <script type="module" src="dist/app.js"></script>
</body>


</html>
